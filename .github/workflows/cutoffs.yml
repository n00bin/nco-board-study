# Keeps data/cutoffs.json current. Runs once a day; commits only when the numbers change.
# If the source looks wrong the job fails (GitHub emails the repo owner) and the app keeps the last good month.
name: Update promotion cutoff scores

on:
  schedule:
    - cron: "23 11 * * *"   # daily, 11:23 UTC
  workflow_dispatch: {}      # "Run workflow" button on GitHub, for a manual refresh

permissions:
  contents: write

concurrency:
  group: cutoffs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch this month's cutoff scores
        run: python scripts/update_cutoffs.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- data/cutoffs.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "cutoff-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cutoffs.json
          git commit -m "Cutoff scores: $(python -c "import json;print(json.load(open('data/cutoffs.json'))['cycle'])")"
          git push
